[project]
name = "hermes-cli"
version = "0.1.0"
description = "Fleet management wrapper around Docker Compose for the hermes registry"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
hc = "hermes_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hermes_cli*"]
